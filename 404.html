<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Page Not Found</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, -apple-system, sans-serif; background: #f8fafc; color: #0f172a; }
  .box { text-align: center; padding: 32px 24px; max-width: 380px; background: #fff; border: 1px solid #e2e8f0; border-radius: 20px; box-shadow: 0 10px 30px rgba(15,23,42,.06); }
  h1 { margin: 0; font-size: 48px; font-weight: 900; color: #ef4444; }
  p { margin: 10px 0 20px; font-size: 14px; color: #64748b; }
  a { display: inline-block; padding: 10px 20px; border-radius: 12px; background: #0f172a; color: #fff; text-decoration: none; font-weight: 700; font-size: 13px; }
</style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <p>The page you requested does not exist.</p>
    <a href="/">Back to Home</a>
  </div>
</body>
</html>
